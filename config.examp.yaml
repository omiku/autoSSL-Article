server:
  port: 8080
database:
  driver: "mysql"
  host: "localhost"
  port: 3306
  user: "root"
  password: "your_password"
  name: "your_database_name"
  unix_socket: false
logger:
  level: "info"       # 日志级别: debug/info/warn/error
  filename: ""        # 日志文件路径，为空时输出到控制台
  max_size: 100       # 日志文件最大大小(MB)
  max_backups: 3      # 保留的旧日志文件最大数量
  max_age: 28         # 保留旧日志文件的最大天数
  compress: true      # 是否压缩/归档旧日志文件
  development: false  # 开发模式开关，影响日志格式
captcha:
  type: "base64captcha"
  base64:
    digit_height: 60
    digit_width: 20
    digit_length: 4
    max_skew: 0.7
    dot_count: 80
  gocaptcha:
    store: "memory"
    click_len: 4
    click_range_size: 30
    background_image: "sourcedata/images/image-v2-1/image.jpg"