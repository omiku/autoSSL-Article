  /cert/certificates/{id}/download:
    get:
      consumes:
      - application/json
      description: |-
        下载指定证书的所有格式（PEM、DER、PFX、JKS等）打包为zip文件
        支持多种证书格式导出，包括：
        - PEM格式：包含证书和私钥的文本格式
        - DER格式：二进制格式的证书
        - PFX格式：包含证书和私钥的PKCS12格式
        - JKS格式：Java密钥库格式
      parameters:
      - description: 证书ID
        in: path
        name: id
        required: true
        type: integer
      - description: PFX/JKS格式密码（默认：changeit）
        in: query
        name: password
        type: string
      produces:
      - application/zip
      responses:
        "200":
          description: 证书压缩包
          schema:
            type: file
        "400":
          description: 无效ID格式
          schema:
            type: string
        "404":
          description: 证书不存在
          schema:
            type: string
        "500":
          description: 服务器错误
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: 下载证书
      tags:
      - 证书管理
