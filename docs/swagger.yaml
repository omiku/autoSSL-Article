      email:
        description: 登录邮箱
        type: string
      id:
        description: ID of the ent.
        type: integer
      is_active:
        description: 账户状态
        type: boolean
      is_admin:
        description: 管理员标识
        type: boolean
      updated_at:
        description: UpdatedAt holds the value of the "updated_at" field.
        type: string
    type: object
  ent.UserEdges:
    properties:
      access_configs:
        description: 访问配置
        items:
          $ref: '#/definitions/ent.Access'
        type: array
      acme_accounts:
        description: 用户的ACME账户
        items:
          $ref: '#/definitions/ent.ACMEAccount'
        type: array
      certificates:
        description: 用户证书
        items:
          $ref: '#/definitions/ent.Certificate'
        type: array
      dns_providers:
        description: DNS提供商配置
        items:
          $ref: '#/definitions/ent.DNSProvider'
        type: array
      notification_configs:
        description: 通知配置
        items:
          $ref: '#/definitions/ent.NotificationConfig'
        type: array
      orders:
        description: 用户订单
        items:
          $ref: '#/definitions/ent.Order'
        type: array
      roles:
        description: 用户角色
        items:
          $ref: '#/definitions/ent.Role'
        type: array
      server_groups:
        description: 服务器组
        items:
          $ref: '#/definitions/ent.ServerGroup'
        type: array
      workflow_steps:
        description: 工作流步骤
        items:
          $ref: '#/definitions/ent.WorkflowStep'
        type: array
      workflows:
        description: 用户工作流
        items:
          $ref: '#/definitions/ent.Workflow'
        type: array
    type: object
  ent.Workflow:
    properties:
      completed_at:
        description: 完成时间
        type: string
      created_at:
        description: CreatedAt holds the value of the "created_at" field.
        type: string
      current_step:
        description: 当前工作流步骤
        type: integer
      domain:
        description: 域名
        type: string
      edges:
        allOf:
        - $ref: '#/definitions/ent.WorkflowEdges'
        description: |-
          Edges holds the relations/edges for other nodes in the graph.
          The values are being populated by the WorkflowQuery when eager-loading is set.
      id:
        description: ID of the ent.
        type: integer
      status:
        description: '工作流状态: pending, processing, issued, deploying, completed, failed,
          cancelled'
        type: string
      total_steps:
        description: 总工作流步骤数
        type: integer
      updated_at:
        description: UpdatedAt holds the value of the "updated_at" field.
        type: string
    type: object
  ent.WorkflowEdges:
    properties:
      certificate:
        allOf:
        - $ref: '#/definitions/ent.Certificate'
        description: Certificate holds the value of the certificate edge.
      steps:
        description: Steps holds the value of the steps edge.
        items:
          $ref: '#/definitions/ent.WorkflowStep'
        type: array
      user:
        allOf:
        - $ref: '#/definitions/ent.User'
        description: User holds the value of the user edge.
    type: object
  ent.WorkflowStep:
    properties:
      completed_at:
        description: 完成时间
        type: string
      created_at:
        description: CreatedAt holds the value of the "created_at" field.
        type: string
      edges:
        allOf:
        - $ref: '#/definitions/ent.WorkflowStepEdges'
        description: |-
          Edges holds the relations/edges for other nodes in the graph.
          The values are being populated by the WorkflowStepQuery when eager-loading is set.
      id:
        description: ID of the ent.
        type: integer
      log:
        description: 步骤日志
        type: string
      name:
        description: 步骤名称
        type: string
      started_at:
        description: 开始时间
        type: string
      status:
        allOf:
        - $ref: '#/definitions/workflowstep.Status'
        description: 步骤状态
      step_number:
        description: 步骤编号
        type: integer
    type: object
  ent.WorkflowStepEdges:
    properties:
      certificate:
        allOf:
        - $ref: '#/definitions/ent.Certificate'
        description: Certificate holds the value of the certificate edge.
      user:
        description: 所属用户
        items:
          $ref: '#/definitions/ent.User'
        type: array
      workflow:
        allOf:
        - $ref: '#/definitions/ent.Workflow'
        description: 所属工作流
    type: object
  notification.CreateConfigRequest:
    properties:
      config:
        additionalProperties: true
        type: object
      is_active:
        type: boolean
      name:
        type: string
      type:
        enum:
        - webhook
        - email
        - sms
        type: string
    required:
    - config
    - name
    - type
    type: object
  notification.CreateTemplateRequest:
    properties:
      content_template:
        type: string
      format:
        type: string
      name:
        type: string
      subject_template:
        type: string
      template_type:
        type: string
    required:
    - content_template
    - format
    - name
    - template_type
    type: object
  notification.EventNotificationConfig:
    properties:
      methods:
        description: 通知方式配置
        items:
          $ref: '#/definitions/notification.NotificationMethod'
        type: array
      template_id:
        description: 模板ID（可选）
        type: integer
    type: object
  notification.NotificationMethod:
    properties:
      config_ids:
        description: 用户自定义配置ID（当UseSystemGlobal为false时使用）
        items:
          type: integer
        type: array
      targets:
        description: |-
          通知目标配置
          email: 邮箱地址列表
          sms: 手机号列表
          webhook: webhook配置ID列表
        items:
          type: string
        type: array
      type:
        description: '通知类型: email, sms, webhook'
        type: string
      use_system_global:
        description: 使用系统全局配置
        type: boolean
    type: object
  notification.TemplateResponse:
    properties:
      content_template:
        type: string
      created_at:
        type: string
      format:
        type: string
      id:
        type: integer
      is_system_default:
        type: boolean
      name:
        type: string
      subject_template:
        type: string
      template_type:
        type: string
      updated_at:
        type: string
    type: object
  notification.UnifiedNotificationConfig:
    properties:
      enabled:
        description: 是否启用通知（总开关）
        type: boolean
      events:
        additionalProperties:
          $ref: '#/definitions/notification.EventNotificationConfig'
        description: |-
          事件级别的通知配置
          键为事件类型，值为该事件的通知配置
        type: object
      global:
        allOf:
        - $ref: '#/definitions/notification.EventNotificationConfig'
        description: 全局通知配置（当Events未配置特定事件时使用）
    type: object
  notification.UpdateConfigRequest:
    properties:
      config:
        additionalProperties: true
        type: object
      is_active:
        type: boolean
      name:
        type: string
      type:
        enum:
        - webhook
        - email
        - sms
        type: string
    type: object
  notification.UpdateTemplateRequest:
    properties:
      content_template:
        type: string
      format:
        type: string
      name:
        type: string
      subject_template:
        type: string
    required:
    - content_template
    - format
    - name
    type: object
  notification.UserEmailConfigResponse:
    properties:
      from_name:
        type: string
      is_configured:
        type: boolean
    type: object
  notification.UserSMSConfigResponse:
    properties:
      is_configured:
        type: boolean
      sign_name:
        type: string
    type: object
  notificationconfig.Type:
    enum:
    - webhook
    - email
    - sms
    type: string
    x-enum-varnames:
    - TypeWebhook
    - TypeEmail
    - TypeSms
  order.OrderType:
    enum:
    - new
    - renew
    - upgrade
    type: string
    x-enum-varnames:
    - OrderTypeNew
    - OrderTypeRenew
    - OrderTypeUpgrade
  order.Status:
    enum:
    - pending
    - pending
    - active
    - expired
    type: string
    x-enum-varnames:
    - DefaultStatus
    - StatusPending
    - StatusActive
    - StatusExpired
  pagination.PaginatedResponse:
    properties:
      data:
        description: 数据列表
      page:
        description: 当前页码
        type: integer
      page_size:
        description: 每页数量
        type: integer
      total:
        description: 总记录数
        type: integer
      total_pages:
        description: 总页数
        type: integer
    type: object
  response.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  servergroup.CreateServerGroupRequest:
    properties:
      access_ids:
        items:
          $ref: '#/definitions/servergroup.ServerGroupAccess'
        type: array
      description:
        type: string
      name:
        type: string
      status:
        type: string
      user_id:
        type: integer
    type: object
  servergroup.ServerGroupAccess:
    properties:
      access_id:
        type: integer
      type:
        type: string
    type: object
  servergroup.Status:
    enum:
    - active
    - active
    - inactive
    type: string
    x-enum-varnames:
    - DefaultStatus
    - StatusActive
    - StatusInactive
  servergroup.Type:
    enum:
    - ssh
    - api
    - tencentcloud-teo
    type: string
    x-enum-varnames:
    - TypeSSH
    - TypeAPI
    - TypeTencentcloudTeo
  servergroup.UpdateServerGroupRequest:
    description: 根据用户ID、服务器组ID和新参数更新现有服务器组记录，并更新远程权限关联
    properties:
      access_ids:
        items:
          $ref: '#/definitions/servergroup.ServerGroupAccess'
        type: array
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      status:
        type: string
      user_id:
        type: integer
    type: object
  servergroupmember.Type:
    enum:
    - ssh
    - api
    - other
    type: string
    x-enum-varnames:
    - TypeSSH
    - TypeAPI
    - TypeOther
  workflowstep.Status:
    enum:
    - pending
    - pending
    - processing
    - issued
    - deploying
    - completed
    - failed
    - cancelled
    type: string
    x-enum-varnames:
    - DefaultStatus
    - StatusPending
    - StatusProcessing
    - StatusIssued
    - StatusDeploying
    - StatusCompleted
    - StatusFailed
    - StatusCancelled
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
  description: AutoSSL 证书管理API文档
  license:
    name: MIT
    url: http://opensource.org/licenses/MIT
  termsOfService: http://example.com/terms
  title: AutoSSL API
  version: "1.0"
paths:
  /access:
    get:
      consumes:
      - application/json
      description: 根据用户ID获取访问配置列表，支持分页
      parameters:
      - description: 页码，默认1
        in: query
        name: page
        type: integer
      - description: 每页条数，默认10
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/ent.Access'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 获取访问配置列表
      tags:
      - access
    post:
      consumes:
      - application/json
      description: 创建新的访问配置记录
      parameters:
      - description: 访问配置信息
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/access.CreateAccessRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/ent.Access'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 创建访问配置
      tags:
      - access
  /access/{id}:
    delete:
      consumes:
      - application/json
      description: 根据ID删除访问配置
      parameters:
      - description: 访问配置ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: string
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 删除访问配置
      tags:
      - access
    get:
      consumes:
      - application/json
      description: 根据ID获取访问配置详细信息
      parameters:
      - description: 访问配置ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/ent.Access'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 获取访问配置详情
      tags:
      - access
    put:
      consumes:
      - application/json
      description: 根据ID更新访问配置信息
      parameters:
      - description: 访问配置ID
        in: path
        name: id
        required: true
        type: integer
      - description: 访问配置信息
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/access.UpdateAccessRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/ent.Access'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 更新访问配置
      tags:
      - access
  /admin/global-config/email:
    get:
      description: 管理员获取完整的全局邮件配置信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/admin.GlobalEmailConfigResponse'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: 管理员获取全局邮件配置
      tags:
      - 全局通知配置
    post:
      consumes:
      - application/json
      description: 管理员设置全局邮件配置信息
      parameters:
      - description: 邮件配置信息
        in: body
        name: config
        required: true
        schema:
          $ref: '#/definitions/admin.SetEmailConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: 管理员设置全局邮件配置
      tags:
      - 全局通知配置
  /admin/global-config/sms:
    get:
      description: 管理员获取完整的全局短信配置信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/admin.AdminGlobalSMSConfigResponse'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: 管理员获取全局短信配置
      tags:
      - 全局通知配置
    post:
      consumes:
      - application/json
      description: 管理员设置全局短信配置信息
      parameters:
      - description: 短信配置信息
        in: body
        name: config
        required: true
        schema:
          $ref: '#/definitions/admin.SetSMSConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: 管理员设置全局短信配置
      tags:
      - 全局通知配置
  /admin/users:
    get:
      consumes:
      - application/json
      description: 管理员获取系统所有用户列表（需要管理员权限）
      produces:
      - application/json
      responses:
        "200":
          description: 成功响应
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/ent.User'
                  type: array
              type: object
        "500":
          description: 服务器错误
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: 获取所有用户
      tags:
      - 管理员
  /admin/users/role:
    put:
      consumes:
      - application/json
      description: 管理员修改指定用户的角色（需要管理员权限）
      produces:
      - application/json
      responses:
        "200":
          description: 成功响应
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 无效请求格式
          schema:
            type: string
        "500":
          description: 服务器错误
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: 更新用户角色
      tags:
      - 管理员
  /api/templates:
    get:
      description: 获取当前用户的所有自定义模板
      parameters:
      - description: 模板类型 (email, sms, webhook)
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 模板列表
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/notification.TemplateResponse'
                  type: array
              type: object
        "401":
          description: 用户未登录
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 获取用户自定义模板列表
      tags:
      - 通知模板
    post:
      consumes:
      - application/json
      description: 创建用户自定义通知模板
      parameters:
      - description: 模板信息
        in: body
        name: template
        required: true
        schema:
          $ref: '#/definitions/notification.CreateTemplateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/notification.TemplateResponse'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 创建用户自定义模板
      tags:
      - 通知模板
  /api/templates/{id}:
    delete:
      description: 删除用户自定义通知模板
      parameters:
      - description: 模板ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: 模板不存在或无权限
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 删除用户自定义模板
      tags:
      - 通知模板
    get:
      description: 获取指定模板的详细信息
      parameters:
      - description: 模板ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 模板详情
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/notification.TemplateResponse'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: 模板不存在或无权限
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 获取模板详情
      tags:
      - 通知模板
    put:
      consumes:
      - application/json
      description: 更新用户自定义通知模板
      parameters:
      - description: 模板ID
        in: path
        name: id
        required: true
        type: integer
      - description: 模板信息
        in: body
        name: template
        required: true
        schema:
          $ref: '#/definitions/notification.UpdateTemplateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/notification.TemplateResponse'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: 模板不存在或无权限
          schema:
            $ref: '#/definitions/response.Response'
        "500":
