      tags:
      - 证书管理
    post:
      consumes:
      - application/json
      description: |-
        根据域名列表、颁发机构等信息创建新的SSL证书

        支持多种验证方式：
        - DNS验证：通过DNS提供商自动添加TXT记录完成验证
        - HTTP验证：通过在服务器上放置验证文件完成验证

        部署配置：
        - 可通过access_ids指定单个或多个服务器进行部署
        - 可通过server_group_id指定服务器组进行批量部署
        - 通过extra_config传递部署适配器特定配置

        通知配置：
        - 支持Webhook、邮件、短信等多种通知方式
        - 可配置在申请、部署、成功、失败等不同阶段发送通知
      parameters:
      - description: 创建证书请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/certificate.CreateCertificateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功响应
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/ent.Certificate'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - ApiKeyAuth: []
      summary: 创建证书
      tags:
      - 证书管理
