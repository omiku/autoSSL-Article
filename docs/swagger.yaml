basePath: /apiv1
definitions:
  access.CreateAccessRequest:
    properties:
      config:
        additionalProperties: true
        description: 配置详情
        type: object
      is_active:
        default: true
        description: 是否启用
        type: boolean
      name:
        description: 配置名称
        type: string
      type:
        description: 访问类型
        enum:
        - ssh
        - api
        - tencentcloud-teo
        type: string
    required:
    - config
    - name
    - type
    type: object
  access.Type:
    enum:
    - ssh
    - api
    - tencentcloud-teo
    - other
    type: string
    x-enum-varnames:
    - TypeSSH
    - TypeAPI
    - TypeTencentcloudTeo
    - TypeOther
  access.UpdateAccessRequest:
