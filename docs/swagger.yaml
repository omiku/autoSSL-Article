        type: string
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - answer
    - captcha_id
    - email
    - password
    type: object
  auth.RegisterResponse:
    description: 注册接口返回的响应数据
    properties:
      email:
        type: string
      id:
        type: integer
    type: object
  certificate.CreateCertificateRequest:
    description: 创建SSL证书所需的完整请求参数
    properties:
      access_ids:
        description: |-
          访问配置ID列表
          @Description 证书部署的目标服务器访问配置ID数组，与server_group_id二选一
          @Example [1,2,3]
        items:
          type: integer
        type: array
      dns_provider_id:
        description: |-
          DNS提供商ID
          @Description DNS提供商的ID，用于DNS验证
          @Example 1
        type: integer
      domains:
        description: |-
          域名列表
          @Description 需要申请证书的域名列表，必须是有效的域名格式，支持多个域名合并到同一证书
          @Example ["example.com","www.example.com","api.example.com"]
        items:
          type: string
        minItems: 1
        type: array
      execute_immediately:
        default: true
        description: |-
          立即执行
          @Description 是否立即开始执行证书申请流程
          @Example true
        type: boolean
      extra_config:
        additionalProperties: true
        description: |-
          额外配置
          @Description 工作流额外配置参数，根据部署方式不同而变化
          @Example {"remote_cert_path":"/etc/nginx/ssl/cert.pem","remote_key_path":"/etc/nginx/ssl/key.pem","pre_command":"nginx -t","post_command":"systemctl reload nginx"}
        type: object
      issued_by:
        description: |-
          颁发机构
          @Description 证书颁发机构，支持 letsencrypt, zerossl 等
          @Example letsencrypt
        type: string
      renewal_days_before:
        description: |-
          续期提前天数
          @Description 证书到期前多少天开始自动续期，范围1-30天
          @Minimum 1
          @Maximum 30
          @Example 30
        maximum: 30
        minimum: 1
        type: integer
      renewal_enabled:
        description: |-
          自动续期
          @Description 是否启用证书自动续期功能
          @Example true
        type: boolean
      server_group_id:
        description: |-
          服务器组ID
          @Description 证书部署的目标服务器组ID，与access_ids二选一
          @Example 1
        type: integer
      unified_notification_config:
        allOf:
        - $ref: '#/definitions/notification.UnifiedNotificationConfig'
        description: |-
          统一通知配置
          @Description 证书状态变更的统一通知配置，支持多种通知方式
          @Example {"use_system_global":true,"targets":{"emails":["admin@example.com"]},"events":["apply_success","deploy_failed"]}
      validation_type:
        description: |-
          验证类型
          @Description 域名验证方式，支持dns或http验证
          @Enum dns,http
          @Example dns
        enum:
        - dns
        - http
        type: string
    required:
    - dns_provider_id
    - domains
    - issued_by
    - validation_type
    type: object
  certificate.Status:
    enum:
    - pending
    - pending
    - processing
    - issued
    - deploying
    - completed
    - failed
    type: string
    x-enum-varnames:
    - DefaultStatus
    - StatusPending
    - StatusProcessing
    - StatusIssued
    - StatusDeploying
    - StatusCompleted
    - StatusFailed
  certificate.ValidationType:
