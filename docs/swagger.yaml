  auth.LoginRequest:
    description: 登录接口所需的请求参数
    properties:
      answer:
        type: string
      captcha_id:
        type: string
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - answer
    - captcha_id
    - email
    - password
    type: object
  auth.LoginResponse:
    description: 登录接口返回的响应数据
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  auth.RefreshRequest:
    description: 刷新令牌接口所需的请求参数
